/* =========================

const BUDDY_NAME_KEY =

const BUDDY_DATA_KEY =

const HISTORY_KEY =

/* =========================
   HTML安全化
========================= */

function escapeHtml(value){

  return String(value)
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");

}


/* =========================
   相棒データ
========================= */

function getBuddyData(){

  const saved =
    localStorage.getItem(
      BUDDY_DATA_KEY
    );

  if(saved){

    try{

      return JSON.parse(saved);

    }catch(error){

      console.error(error);

    }

  }

  return {

    level:1,
    searchCount:0,
    foundCount:0,
    saveCount:0

  };

}


function saveBuddyData(data){

  localStorage.setItem(
    BUDDY_DATA_KEY,
    JSON.stringify(data)
  );

}


function updateBuddyStats(){

  const data =
    getBuddyData();

  searchCount.textContent =
    data.searchCount;

  foundCount.textContent =
    data.foundCount;

  saveCount.textContent =
    data.saveCount;

  buddyLevel.textContent =
    `⭐ 相棒レベル ${data.level}`;

}


/* =========================
   相棒レベル計算
========================= */

function calculateLevel(data){

  const points =
    data.searchCount +
    data.foundCount * 2 +
    data.saveCount * 2;

  return Math.max(
    1,
    Math.floor(points / 5) + 1
  );

}


function updateBuddyLevel(){

  const data =
    getBuddyData();

  const oldLevel =
    data.level;

  const newLevel =
    calculateLevel(data);

  data.level =
    newLevel;

  saveBuddyData(data);

  updateBuddyStats();

  return newLevel > oldLevel;

}

/* =========================
   GPS
========================= */

function getLocation(){

  return new Promise(
    (resolve,reject)=>{

      if(
        !navigator.geolocation
      ){

        reject(
          new Error(
            "GPSが利用できません"
          )
        );

        return;

      }


      navigator.geolocation.getCurrentPosition(

        position=>{

          resolve({

            lat:
              position.coords.latitude,

            lng:
              position.coords.longitude

          });

        },

        error=>{

          reject(error);

        },

        {

          enableHighAccuracy:true,

          timeout:15000,

          maximumAge:0

        }

      );

    }
  );

}


/* =========================
   距離計算
========================= */

function distance(
  lat1,
  lng1,
  lat2,
  lng2
){

  const R =
    6371000;

  const rad =
    Math.PI / 180;

  const dLat =
    (lat2-lat1)*rad;

  const dLng =
    (lng2-lng1)*rad;

  const a =
    Math.sin(dLat/2) *
    Math.sin(dLat/2) +

    Math.cos(lat1*rad) *
    Math.cos(lat2*rad) *

    Math.sin(dLng/2) *
    Math.sin(dLng/2);

  const c =
    2 *
    Math.atan2(
      Math.sqrt(a),
      Math.sqrt(1-a)
    );

  return R*c;

}
