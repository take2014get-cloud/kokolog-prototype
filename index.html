<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>ココログ</title>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  font-family:-apple-system,BlinkMacSystemFont,"Noto Sans JP",sans-serif;
  background:linear-gradient(180deg,#f4f1ff,#fff 55%,#eef8ff);
  color:#333;
}

.container{
  max-width:520px;
  margin:auto;
  padding:18px 14px 40px;
}

h1{
  text-align:center;
  margin:8px 0 4px;
  font-size:30px;
}

.subtitle{
  text-align:center;
  color:#777;
  font-size:14px;
  margin-bottom:18px;
}

.card{
  background:#fff;
  border-radius:20px;
  padding:18px;
  margin-bottom:15px;
  box-shadow:0 5px 20px rgba(0,0,0,.08);
}

.buddy{
  text-align:center;
  font-size:70px;
}

.buddy-message{
  background:#f7f3ff;
  border-radius:16px;
  padding:15px;
  line-height:1.7;
  text-align:center;
  min-height:70px;
}

input,textarea{
  width:100%;
  border:1px solid #ddd;
  border-radius:12px;
  padding:12px;
  font-size:16px;
  outline:none;
}

textarea{
  min-height:110px;
  resize:vertical;
}

button{
  width:100%;
  border:0;
  border-radius:14px;
  padding:14px;
  font-size:16px;
  font-weight:bold;
  cursor:pointer;
  margin-top:9px;
  background:#6c63ff;
  color:white;
}

.secondary{
  background:#777;
}

.find-button{
  background:#ff6b6b;
  font-size:18px;
  padding:16px;
}

.status{
  text-align:center;
  margin-top:12px;
  color:#666;
  min-height:24px;
}

.stats{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:8px;
  margin-top:15px;
}

.stat{
  background:#fafafa;
  border-radius:14px;
  text-align:center;
  padding:12px 5px;
}

.stat-number{
  font-size:24px;
  font-weight:bold;
}

.stat-label{
  font-size:11px;
  color:#777;
}

.level{
  text-align:center;
  margin-top:12px;
  font-size:14px;
}

.treasure{
  border:2px solid #eee;
  border-radius:16px;
  padding:15px;
  margin-top:12px;
}

.treasure-distance{
  font-weight:bold;
  margin-bottom:8px;
}

.treasure-text{
  line-height:1.7;
  white-space:pre-wrap;
}

.treasure-meta{
  color:#888;
  font-size:12px;
  margin-top:10px;
}

.history{
  border-bottom:1px solid #eee;
  padding:12px 0;
}

.history:last-child{
  border-bottom:0;
}

.history-title{
  font-weight:bold;
}

.history-date{
  font-size:12px;
  color:#888;
  margin-top:4px;
}

.no-history{
  text-align:center;
  color:#888;
  padding:15px;
}

#flash{
  position:fixed;
  inset:0;
  background:rgba(255,255,255,.96);
  display:none;
  align-items:center;
  justify-content:center;
  z-index:9999;
}

#flash.show{
  display:flex;
}

#flashText{
  text-align:center;
  font-size:32px;
  font-weight:bold;
}
</style>
</head>

<body>

<div class="container">

<h1>🐾 ココログ</h1>

<div class="subtitle">
この場所に、あなたの言葉を残そう。
</div>


<!-- =========================
     相棒
========================= -->

<div class="card">

<div class="buddy">🐾</div>

<div id="buddyMessage" class="buddy-message">
🐾 相棒と一緒に宝を探そう！
</div>

<div style="text-align:center;margin-top:14px">

<input
  id="buddyName"
  type="text"
  maxlength="12"
  placeholder="相棒の名前を入力"
>

<button
  id="setBuddyBtn"
  class="secondary"
>
🐾 この名前にする
</button>

</div>

<div id="buddyLevel" class="level">
⭐ 相棒レベル 1
</div>

<div class="stats">

<div class="stat">
<div id="searchCount" class="stat-number">0</div>
<div class="stat-label">宝探し</div>
</div>

<div class="stat">
<div id="foundCount" class="stat-number">0</div>
<div class="stat-label">発見</div>
</div>

<div class="stat">
<div id="saveCount" class="stat-number">0</div>
<div class="stat-label">宝を残した</div>
</div>

</div>

</div>


<!-- =========================
     宝を探す
========================= -->

<div class="card">

<button
  id="findBtn"
  class="find-button"
>
🔎 近くの宝を探す
</button>

<div id="status" class="status"></div>

<div id="treasures"></div>

</div>


<!-- =========================
     宝を残す
========================= -->

<div class="card">

<h2>💎 宝を残す</h2>

<textarea
  id="treasureText"
  placeholder="この場所に残したい言葉を書いてみよう…"
></textarea>

<button id="saveBtn">
✨ この場所に宝を残す
</button>

<div id="saveStatus" class="status"></div>

</div>


<!-- =========================
     発見した宝
========================= -->

<div class="card">

<h2>🏆 発見した宝</h2>

<div id="foundTreasures">

<div class="no-history">
まだ発見した宝はないよ。<br>
宝を探しに行ってみよう！
</div>

</div>

</div>

</div>


<div id="flash">
<div id="flashText">
💎✨<br>
宝を発見！
</div>
</div>


<script type="module">

/* =========================
   Firebase
========================= */

import { initializeApp }
from "https://www.gstatic.com/firebasejs/12.18.0/firebase-app.js";

import {
  getFirestore,
  collection,
  addDoc,
  getDocs,
  serverTimestamp
}
from "https://www.gstatic.com/firebasejs/12.18.0/firebase-firestore.js";


const firebaseConfig = {

  apiKey:"AIzaSyCwlrGb45ZlCoiWq549iAusHA0t6DlobEY",

  authDomain:"kokolog-49f3a.firebaseapp.com",

  projectId:"kokolog-49f3a",

  storageBucket:"kokolog-49f3a.firebasestorage.app",

  messagingSenderId:"502064180142",

  appId:"1:502064180142:web:f52b885f1f6821880e363f"

};


const app=initializeApp(firebaseConfig);

const db=getFirestore(app);


/* =========================
   HTML要素
========================= */

const findBtn=document.getElementById("findBtn");

const saveBtn=document.getElementById("saveBtn");

const treasureText=
document.getElementById("treasureText");

const treasuresBox=
document.getElementById("treasures");

const status=
document.getElementById("status");

const saveStatus=
document.getElementById("saveStatus");

const buddyMessage=
document.getElementById("buddyMessage");

const buddyName=
document.getElementById("buddyName");

const setBuddyBtn=
document.getElementById("setBuddyBtn");

const foundTreasures=
document.getElementById("foundTreasures");

const flash=
document.getElementById("flash");

const flashText=
document.getElementById("flashText");

const buddyLevel=
document.getElementById("buddyLevel");

const searchCount=
document.getElementById("searchCount");

const foundCount=
document.getElementById("foundCount");

const saveCount=
document.getElementById("saveCount");


/* =========================
   保存キー
========================= */

const NAME_KEY=
"kokolog_buddy_name";

const DATA_KEY=
"kokolog_buddy_data";

const HISTORY_KEY=
"kokolog_found_treasures";


/* =========================
   HTML安全化
========================= */

function escapeHtml(value){

return String(value)
.replace(/&/g,"&amp;")
.replace(/</g,"&lt;")
.replace(/>/g,"&gt;")
.replace(/"/g,"&quot;")
.replace(/'/g,"&#039;");

}


/* =========================
   相棒データ
========================= */

function getBuddyData(){

const saved=
localStorage.getItem(DATA_KEY);

if(saved){

try{

return JSON.parse(saved);

}catch(e){

console.error(e);

}

}

return {

level:1,
searchCount:0,
foundCount:0,
saveCount:0

};

}


function saveBuddyData(data){

localStorage.setItem(
DATA_KEY,
JSON.stringify(data)
);

}


function updateBuddyStats(){

const data=getBuddyData();

searchCount.textContent=
data.searchCount;

foundCount.textContent=
data.foundCount;

saveCount.textContent=
data.saveCount;

buddyLevel.textContent=
`⭐ 相棒レベル ${data.level}`;

}


/* =========================
   相棒メッセージ
========================= */

function setBuddy(message){

buddyMessage.innerHTML=
message;

}


function buddyTalk(message){

const name=
localStorage.getItem(NAME_KEY) ||
"相棒";

setBuddy(
`🐾 ${escapeHtml(name)}「${message}」`
);

}


/* =========================
   相棒の名前
========================= */

function saveBuddyName(){

const name=
buddyName.value.trim();

if(!name){

setBuddy(
"🐾 名前を決めてくれたら嬉しいな。"
);

return;

}

localStorage.setItem(
NAME_KEY,
name
);

buddyTalk(
"よろしくね！<br>" +
"これから一緒に宝を探そう！"
);

}


setBuddyBtn.addEventListener(
"click",
saveBuddyName
);


/* =========================
   GPS
========================= */

function getLocation(){

return new Promise(
(resolve,reject)=>{

if(!navigator.geolocation){

reject(
new Error("GPSが利用できません")
);

return;

}

navigator.geolocation.getCurrentPosition(

position=>{

resolve({

lat:position.coords.latitude,

lng:position.coords.longitude

});

},

error=>{

reject(error);

},

{

enableHighAccuracy:true,

timeout:15000,

maximumAge:0

}

);

}
);

}


/* =========================
   距離計算
========================= */

function distance(
lat1,lng1,
lat2,lng2
){

const R=6371000;

const rad=Math.PI/180;

const dLat=
(lat2-lat1)*rad;

const dLng=
(lng2-lng1)*rad;

const a=
Math.sin(dLat/2)**2+
Math.cos(lat1*rad)*
Math.cos(lat2*rad)*
Math.sin(dLng/2)**2;

const c=
2*Math.atan2(
Math.sqrt(a),
Math.sqrt(1-a)
);

return R*c;

}


/* =========================
   発見履歴
========================= */

function getFoundHistory(){

const saved=
localStorage.getItem(HISTORY_KEY);

if(!saved)return [];

try{

return JSON.parse(saved);

}catch(e){

return [];

}

}


function saveFoundHistory(history){

localStorage.setItem(
HISTORY_KEY,
JSON.stringify(history)
);

}


function addFoundTreasure(treasure){

const history=
getFoundHistory();

if(
history.some(
item=>item.id===treasure.id
)
){

return false;

}

history.unshift({

id:treasure.id,

text:treasure.text,

foundAt:
new Date().toLocaleString("ja-JP")

});

saveFoundHistory(history);

renderFoundHistory();

return true;

}


function renderFoundHistory(){

const history=
getFoundHistory();

if(history.length===0){

foundTreasures.innerHTML=
`
<div class="no-history">
まだ発見した宝はないよ。<br>
宝を探しに行ってみよう！
</div>
`;

return;

}

foundTreasures.innerHTML=
history.map(item=>`

<div class="history">

<div class="history-title">
💎 ${escapeHtml(item.text)}
</div>

<div class="history-date">
発見：${escapeHtml(item.foundAt)}
</div>

</div>

`).join("");

}


/* =========================
   レベル
========================= */

function updateLevel(){

const data=getBuddyData();

const points=
data.searchCount+
data.foundCount*2+
data.saveCount*2;

const newLevel=
Math.max(
1,
Math.floor(points/5)+1
);

const changed=
newLevel>data.level;

data.level=newLevel;

saveBuddyData(data);

updateBuddyStats();

return changed;

}


/* =========================
   宝を残す
========================= */

async function saveTreasure(){

const text=
treasureText.value.trim();

if(!text){

saveStatus.textContent=
"💬 残したい言葉を書いてね。";

buddyTalk(
"何を残そうかな？<br>" +
"言葉をひとつ書いてみて！"
);

return;

}

saveStatus.textContent=
"📍 現在地を確認しています…";

buddyTalk(
"どこに残すか確認するね。"
);

try{

const location=
await getLocation();

await addDoc(
collection(db,"treasures"),
{

text:text,

lat:location.lat,

lng:location.lng,

createdAt:serverTimestamp()

}
);

const data=getBuddyData();

data.saveCount++;

saveBuddyData(data);

const levelUp=updateLevel();

treasureText.value="";

saveStatus.textContent=
"✨ 宝を残した！";

if(levelUp){

buddyTalk(
"<strong>レベルアップ！🎉</strong><br>" +
"ココも少し成長したよ！"
);

}else{

buddyTalk(
"宝がひとつ増えたね。<br>" +
"誰かが見つけてくれるといいね。"
);

}

}catch(error){

console.error(error);

saveStatus.textContent=
"❌ 宝を残せませんでした。";

buddyTalk(
"ごめんね。<br>" +
"今は宝を残せなかったみたい。"
);

}

}


/* =========================
   宝を探す
========================= */

async function findTreasures(){

treasuresBox.innerHTML="";

status.textContent=
"📍 現在地を確認しています…";

const data=getBuddyData();

data.searchCount++;

saveBuddyData(data);

updateLevel();

buddyTalk(
"ちょっと待ってね。<br>" +
"今いる場所を調べてるよ。"
);

try{

const location=
await getLocation();

status.textContent=
"🔎 この近くの宝を探しています…";

buddyTalk(
"よし、場所が分かった！<br>" +
"この近くに宝がないか探してみよう。"
);

const snapshot=
await getDocs(
collection(db,"treasures")
);

const treasures=[];

snapshot.forEach(docSnap=>{

const treasure=
docSnap.data();

if(
typeof treasure.lat!=="number" ||
typeof treasure.lng!=="number"
){

return;

}

const dist=
distance(
location.lat,
location.lng,
treasure.lat,
treasure.lng
);

if(dist<=100){

treasures.push({

id:docSnap.id,

text:treasure.text || "",

distance:dist,

lat:treasure.lat,

lng:treasure.lng

});

}

});


treasures.sort(
(a,b)=>a.distance-b.distance
);


if(treasures.length===0){

status.textContent=
"🌱 この近くにはまだ宝がないみたい。";

buddyTalk(
"うーん……まだ何も感じないな。<br>" +
"別の場所を探してみよう！"
);

return;

}


const found=
treasures.filter(
t=>t.distance<=10
);


let newlyFound=0;


found.forEach(treasure=>{

if(addFoundTreasure(treasure)){

newlyFound++;

}

});


if(newlyFound>0){

const data=getBuddyData();

data.foundCount+=newlyFound;

saveBuddyData(data);

updateLevel();

}


if(found.length>0){

status.textContent=
"💎 宝を発見しました！";

buddyTalk(
"<strong>あっ！！</strong><br>" +
"宝がある！"
);

flashText.innerHTML=
"💎✨<br>宝を発見！";

flash.classList.add("show");

setTimeout(
()=>{
flash.classList.remove("show");
},
1600
);

}
else if(
treasures.some(
t=>t.distance<=30
)
){

status.textContent=
"👀 宝はかなり近くにあります。";

buddyTalk(
"かなり近い……。<br>" +
"この辺りに宝があるよ。"
);

}
else{

status.textContent=
"✨ 宝の気配を感じます。";

buddyTalk(
"何か感じる……。<br>" +
"この近くに宝があるみたい。"
);

}


treasures.forEach(treasure=>{

const div=
document.createElement("div");

div.className="treasure";

let distanceText;

if(treasure.distance<=10){

distanceText=
"💎 宝を発見！";

}
else if(treasure.distance<=30){

distanceText=
`🔥 約${Math.round(treasure.distance)}m`;

}
else{

distanceText=
`✨ 約${Math.round(treasure.distance)}m`;

}

div.innerHTML=`

<div class="treasure-distance">
${distanceText}
</div>

<div class="treasure-text">
${escapeHtml(treasure.text)}
</div>

<div class="treasure-meta">
${
treasure.distance<=10
?"この場所に眠っていた宝だよ"
:"もう少し近づいてみよう"
}
</div>

`;

treasuresBox.appendChild(div);

});


}catch(error){

console.error(error);

status.textContent=
"❌ 宝を探せませんでした。";

buddyTalk(
"ごめんね。<br>" +
"今は宝を探せなかったみたい。"
);

}

}


/* =========================
   ボタン
========================= */

findBtn.addEventListener(
"click",
findTreasures
);

saveBtn.addEventListener(
"click",
saveTreasure
);


/* =========================
   起動
========================= */

renderFoundHistory();

updateBuddyStats();

const savedName=
localStorage.getItem(NAME_KEY);

if(savedName){

buddyName.value=
savedName;

setBuddy(
`🐾 ${escapeHtml(savedName)}だよ！<br>
今日も一緒に宝を探そう！`
);

}

</script>

</body>
</html>
