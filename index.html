<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ココログ 0.2</title>
<style>
body{margin:0;font-family:system-ui,-apple-system,sans-serif;background:#f4f7f6;color:#263238}
.wrap{max-width:520px;margin:auto;padding:24px 16px}
.card{background:white;border-radius:22px;padding:24px;box-shadow:0 4px 18px #0001}
h1{text-align:center;font-size:30px;margin:0 0 4px}
.sub{text-align:center;color:#607d8b;margin-bottom:18px}
.buddy{text-align:center;font-size:64px;margin:10px}
button{width:100%;border:0;border-radius:14px;padding:16px;margin-top:10px;font-size:17px;font-weight:bold;background:#607d8b;color:white}
input,textarea{box-sizing:border-box;width:100%;padding:13px;border:1px solid #ddd;border-radius:12px;font-size:16px;margin-top:8px}
textarea{height:90px}
#status{line-height:1.7;margin-top:16px}
.treasure{background:#f7faf9;border-radius:14px;padding:14px;margin-top:12px}
.small{font-size:13px;color:#78909c}
</style>
</head>

<body>
<div class="wrap">
<div class="card">
<h1>ココログ</h1>
<div class="sub">この場所に、あなたの言葉を残そう。</div>
<div class="buddy">🐾</div>

<button id="findBtn">🔎 近くの宝を探す</button>

<div id="status">準備OK。宝を探してみよう。</div>

<div id="treasures"></div>

<hr style="margin:24px 0;border:0;border-top:1px solid #eee">

<h2>💎 宝を残す</h2>
<textarea id="text" placeholder="この場所に残したい言葉を書こう"></textarea>
<button id="saveBtn">✨ この場所に宝を残す</button>
</div>
</div>

<script type="module">
import {initializeApp}
from "https://www.gstatic.com/firebasejs/12.18.0/firebase-app.js";

import {
  getFirestore,
  collection,
  addDoc,
  getDocs,
  serverTimestamp
}
from "https://www.gstatic.com/firebasejs/12.18.0/firebase-firestore.js";

const firebaseConfig={
  apiKey:"AIzaSyCwlrGb45ZlCoiWq549iAusHA0t6DlobEY",
  authDomain:"kokolog-49f3a.firebaseapp.com",
  projectId:"kokolog-49f3a",
  storageBucket:"kokolog-49f3a.firebasestorage.app",
  messagingSenderId:"502064180142",
  appId:"1:502064180142:web:f52b885f1f6821880e363f"
};

const app=initializeApp(firebaseConfig);
const db=getFirestore(app);

let currentPosition=null;

function getLocation(){
  return new Promise((resolve,reject)=>{
    if(!navigator.geolocation){
      reject(new Error("この端末は位置情報に対応していません"));
      return;
    }
    navigator.geolocation.getCurrentPosition(resolve,reject,{
      enableHighAccuracy:true,
      timeout:15000,
      maximumAge:0
    });
  });
}

function distance(lat1,lon1,lat2,lon2){
  const R=6371000;
  const r=Math.PI/180;
  const a=
    Math.sin((lat2-lat1)*r/2)**2+
    Math.cos(lat1*r)*Math.cos(lat2*r)*
    Math.sin((lon2-lon1)*r/2)**2;
  return 2*R*Math.asin(Math.sqrt(a));
}

async function findTreasures(){
  const status=document.getElementById("status");
  const box=document.getElementById("treasures");

  status.textContent="📍 現在地を確認中…";
  box.innerHTML="";

  try{
    const pos=await getLocation();
    currentPosition=pos.coords;

    status.textContent=
      `📍 現在地OK\n緯度 ${currentPosition.latitude.toFixed(5)} / 経度 ${currentPosition.longitude.toFixed(5)}\n\n💎 近くの宝を探しています…`;

    const snap=await getDocs(collection(db,"treasures"));
    let found=0;

    snap.forEach(doc=>{
      const t=doc.data();
      if(typeof t.lat!=="number"||typeof t.lng!=="number")return;

      const d=distance(
        currentPosition.latitude,
        currentPosition.longitude,
        t.lat,t.lng
      );

      if(d<=100){
        found++;
        const div=document.createElement("div");
        div.className="treasure";
        div.innerHTML=
          `💎 宝を発見！<br>${escapeHtml(t.text||"")}`+
          `<div class="small">約${Math.round(d)}m</div>`;
        box.appendChild(div);
      }
    });

    status.textContent+=
      `\n\n${found?`✨ ${found}個の宝を発見！`:"まだ近くに宝はないみたい。"}`;
  }catch(e){
    status.textContent="⚠️ 位置情報の取得に失敗しました。"+e.message;
  }
}

async function saveTreasure(){
  const text=document.getElementById("text").value.trim();
  const status=document.getElementById("status");

  if(!text){
    status.textContent="💭 残す言葉を入力してね。";
    return;
  }

  status.textContent="📍 現在地を確認中…";

  try{
    const pos=await getLocation();
    currentPosition=pos.coords;

    await addDoc(collection(db,"treasures"),{
      text:text,
      lat:currentPosition.latitude,
      lng:currentPosition.longitude,
      createdAt:serverTimestamp()
    });

    document.getElementById("text").value="";
    status.textContent="✨ 宝を残した！\nこの場所に、あなたの言葉が残ったよ。";
  }catch(e){
    status.textContent="⚠️ 宝を保存できませんでした。\n"+e.message;
  }
}

function escapeHtml(text){
  const div=document.createElement("div");
  div.textContent=text;
  return div.innerHTML;
}

document.getElementById("findBtn").onclick=findTreasures;
document.getElementById("saveBtn").onclick=saveTreasure;
</script>
</body>
</html>
