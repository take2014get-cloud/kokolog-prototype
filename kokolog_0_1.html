<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ココログ 0.1</title>
<style>
  body{margin:0;font-family:system-ui,-apple-system,sans-serif;background:#f7f4ed;color:#29251f}
  .wrap{max-width:520px;margin:auto;padding:24px}
  .card{background:white;border-radius:22px;padding:20px;box-shadow:0 8px 30px #00000012;margin:14px 0}
  h1{font-size:30px;margin:0 0 4px}.sub{color:#746d63}
  .buddy{font-size:64px;text-align:center;padding:12px}
  button{width:100%;border:0;border-radius:14px;padding:15px;margin-top:10px;font-size:16px;font-weight:700;background:#29251f;color:white}
  button.secondary{background:#eee9df;color:#29251f}
  #status{line-height:1.7}.treasure{display:none}
  .treasure img{width:100%;border-radius:14px}
  .small{font-size:13px;color:#7a7369}
</style>
</head>
<body>
<div class="wrap">
  <div class="card">
    <div class="small">ココログ 0.1 — 試作版</div>
    <h1>この場所に、あなたの言葉を残そう。</h1>
    <div class="buddy">🐾</div>
    <div id="status">相棒が待ってるよ。</div>
    <button onclick="start()">宝を探す</button>
  </div>

  <div class="card treasure" id="treasure">
    <div class="small">🎁 宝を発見</div>
    <h2>誰かが残した写真</h2>
    <p>「この場所から見る夕焼けが好き。」</p>
    <p>🎵 好きな曲：サンプル曲</p>
    <button class="secondary" onclick="leave()">自分も宝を残す</button>
  </div>

  <div class="card" id="leaveCard" style="display:none">
    <h2>🎁 あなたの宝</h2>
    <p>まずは試作なので、写真の代わりに言葉を残してみよう。</p>
    <textarea id="memo" rows="5" style="width:100%;box-sizing:border-box;border:1px solid #ddd;border-radius:12px;padding:12px;font-size:16px" placeholder="この場所に残したい言葉"></textarea>
    <button onclick="saveTreasure()">宝を残す</button>
    <div id="saved" class="small"></div>
  </div>
</div>

<script>
let watchId=null;
function start(){
  const s=document.getElementById('status');
  if(!navigator.geolocation){
    s.textContent='この端末では位置情報が使えないみたい。';
    return;
  }
  s.textContent='📍 現在地を確認中…';
  navigator.geolocation.getCurrentPosition(
    pos=>{
      const lat=pos.coords.latitude, lon=pos.coords.longitude;
      // 0.1では「現在地から近い」という体験だけを検証。
      s.innerHTML='🐾「いた！この近くに宝があるよ。」<br>📍現在地を取得できたよ。<br><span class="small">試作では安全のため正確な座標は表示しません。</span>';
      setTimeout(()=>document.getElementById('treasure').style.display='block',700);
    },
    err=>{
      s.innerHTML='📍 位置情報を取得できなかったよ。<br>ブラウザの位置情報を許可してから、もう一度試してね。';
    },
    {enableHighAccuracy:true,timeout:10000,maximumAge:30000}
  );
}
function leave(){document.getElementById('leaveCard').style.display='block';}
function saveTreasure(){
  const v=document.getElementById('memo').value.trim();
  document.getElementById('saved').textContent =
    v ? '✨ 宝を残した！（0.1では端末内の試作表示のみ）' : '言葉を1つ入れてみてね。';
}
</script>
</body>
</html>
